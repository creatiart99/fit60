  <style>
  :root { --acid:#c9fb52;--acid2:#b9ed38;--ink:#111315;--ink2:#1e2025;--muted:#777c7c;--paper:#f3f4f2;--panel:#fff;--line:#e8eae6;--radius:14px;--shadow:0 7px 25px rgba(27,33,26,.038); }
  * {box-sizing:border-box} html,body{padding:0;margin:0;min-height:100%;font-family:'DM Sans',Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif} button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8faf33;outline-offset:3px} button:disabled{cursor:default;opacity:.5}img{max-width:100%} .app{min-height:100vh;display:flex;background:var(--paper);color:var(--ink)}
  .rail{width:74px;flex:0 0 74px;position:fixed;inset:0 auto 0 0;background:#111416;display:flex;flex-direction:column;align-items:center;z-index:20;padding:18px 8px 20px;gap:9px;border-right:1px solid #22262a} .rail-brand{display:grid;place-items:center;width:58px;height:58px;margin-bottom:24px;text-decoration:none}.rail-brand img{width:50px;height:50px;object-fit:contain}.rail-line{height:1px;background:#2b2c2e;width:30px;margin:-6px 0 13px}.rail nav{display:flex;flex-direction:column;gap:8px;width:100%;align-items:center}.rail-btn{width:44px;height:44px;border:0;border-radius:11px;display:grid;place-items:center;background:transparent;color:#858c8c;transition:background .15s,color .15s}.rail-btn:hover{background:#2a2e2b;color:white}.rail-btn.active{background:var(--acid);color:#161916}.rail-lower{margin-top:auto;display:flex;flex-direction:column;gap:8px;align-items:center}.rail-person{height:33px;width:33px;background:#303735;color:#dcead1;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800}
  .main{margin-left:74px;width:calc(100% - 74px);min-width:0;padding:28px 32px 64px;max-width:1740px}.page-header{display:flex;align-items:center;justify-content:space-between;gap:22px;margin-bottom:24px}.eyebrow{font-size:10px;color:#8b918e;letter-spacing:.08em;font-weight:700}.headline{font-family:Manrope,sans-serif;font-size:23px;font-weight:800;letter-spacing:-.9px;line-height:1.3;margin:5px 0}.subtitle{color:#8e9290;font-size:11.5px;line-height:1.65;margin-top:4px}.header-actions{display:flex;align-items:center;gap:9px}.pill-control{height:35px;border-radius:999px;display:flex;align-items:center;gap:7px;background:#fff;border:1px solid #ecefea;color:#525956;padding:0 13px;font-size:11px;font-weight:700;white-space:nowrap}.pill-control svg{width:15px;height:15px}.icon-control{height:35px;width:35px;display:grid;place-items:center;border:1px solid #e6e8e5;background:#fff;border-radius:50%;color:#707573}.icon-control svg{width:17px;height:17px}.user-chip{display:flex;align-items:center;gap:10px;margin-left:6px;padding-left:14px;border-left:1px solid #e5e8e4}.user-chip .avatar{height:35px;width:35px;border-radius:50%;background:#1d241e;color:var(--acid);display:grid;place-items:center;font-weight:800;font-size:12px}.user-chip strong{display:block;font-size:11px}.user-chip small{display:block;color:#9b9f9b;font-size:10px;margin-top:2px}
  .mode-toggle{display:flex;background:#e7ebe4;padding:3px;border-radius:40px;gap:2px;border:1px solid #e3e7e0}.mode-toggle button{border:0;background:transparent;padding:8px 12px;border-radius:40px;font-size:10px;font-weight:800;color:#747a73;transition:background .2s,color .2s}.mode-toggle button.current{background:#161b19;color:var(--acid);box-shadow:0 2px 8px #0002}.screen{animation:appear .22s ease}@keyframes appear{from{opacity:.6;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

function header(){return `<header class="page-header"><div><div class="eyebrow">FIT60 <span style="color:#afb3ac">/</span> ${st.role==='coach'?'COACH STUDIO':'MI PROGRAMA'}</div><h1 class="headline">${st.role==='coach'?({dashboard:'Buen día, Coach Villa.',students:'Mis alumnos',programs:'Biblioteca de programas',editor:'Editor semanal',nutrition:'Biblioteca de nutrición',activity:'Actividad y seguimiento'}[st.view]||'FIT60') :({dashboard:'Hola, Camila 👋',workouts:'Mis entrenamientos',nutrition:'Mi alimentación',calendar:'Mi semana',activity:'Mi progreso'}[st.view]||'FIT60')}</h1><div class="subtitle">${st.role==='coach'?'Aquí tienes el resumen de tus programas y alumnos.':'Semana 03 de 12 · Transformación FIT60'}</div></div><div class="header-actions"><div class="mode-toggle" aria-label="Vista de usuario"><button class="${st.role==='coach'?'current':''}" data-a="role:coach">Coach Villa</button><button class="${st.role==='student'?'current':''}" data-a="role:student">Alumno</button></div><span class="pill-control">${ico('calendar',14)} 19 oct, 2026</span><button class="icon-control" aria-label="Notificaciones" data-a="modal:notifications">${ico('bell')}</button><div class="user-chip"><span class="avatar">${st.role==='coach'?'V':'C'}</span><span><strong>${st.role==='coach'?'Coach Villa':'Camila Rodríguez'}</strong><small>${st.role==='coach'?'Administrador FIT60':'Miembro FIT60'}</small></span></div></div></header>`}
const stat=(title,val,meta,icon,color,delta)=>`<article class="panel stat"><div class="stat-top"><span>${title}</span><span class="small-icon ${color||''}">${ico(icon)}</span></div><strong>${val}</strong><div class="stat-bottom">${delta?`<span class="delta">${delta}</span>`:''}${meta}</div></article>`;
const phead=(label,sub,action,link)=>`<div class="panel-head"><div><h2>${label}</h2>${sub?`<p>${sub}</p>`:''}</div>${action?`<button class="tiny-link" data-a="${link||'dashboard'}">${action}${ico('arrow',13)}</button>`:''}</div>`;
function lineChart(){return `<div class="chart-wrap"><svg class="line-chart" viewBox="0 0 500 190" preserveAspectRatio="none" role="img" aria-label="Tendencia ilustrativa de entrenamientos y progreso semanal"><defs><linearGradient id="areaL" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c9fb52" stop-opacity=".17"/><stop offset="1" stop-color="#c9fb52" stop-opacity="0"/></linearGradient></defs>${[30,75,120,165].map(y=>`<line x1="8" y1="${y}" x2="492" y2="${y}" stroke="#e8ece8" stroke-dasharray="3 6"/>`).join('')}<path d="M8 118 C38 80 57 131 82 112 S137 52 159 94 S215 140 243 87 S296 30 326 78 S382 126 402 79 S460 42 492 58 L492 185 L8 185Z" fill="url(#areaL)"/><path d="M8 118 C38 80 57 131 82 112 S137 52 159 94 S215 140 243 87 S296 30 326 78 S382 126 402 79 S460 42 492 58" stroke="#9bc83b" fill="none" stroke-width="2.8" stroke-linecap="round"/><path d="M8 141 C43 103 62 140 90 128 S145 111 173 126 S232 74 266 98 S339 131 367 109 S425 72 492 91" stroke="#c7ccca" fill="none" stroke-width="2" stroke-linecap="round"/><line x1="326" x2="326" y1="22" y2="185" stroke="#c4d3a4" stroke-dasharray="4 5"/><circle cx="326" cy="78" r="6" stroke="white" stroke-width="3" fill="#a7d341"/></svg><div class="tip-bubble">+24%</div></div><div class="axis-labels"><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span></div>`}
function calendarWidget(){let days=['L','M','M','J','V','S','D'];let arr=Array.from({length:35},(_,i)=>i-2);return `<div class="calendar-month"><b>Octubre 2026</b><span class="month-arrows"><button data-a="toast:Calendario de demostración" aria-label="Mes anterior">${ico('left',13)}</button><button data-a="toast:Calendario de demostración" aria-label="Mes siguiente">${ico('chev',13)}</button></span></div><div class="calendar-grid">${days.map(d=>`<span class="weekday">${d}</span>`).join('')}${arr.map(n=>n>0&&n<32?`<button class="cal-day ${[2,3,5,7,9,11,12,14,16,19,20,22,23].includes(n)?'complete':''} ${n===19?'today':''} ${n===15?'miss':''}" data-a="toast:Asistencia del ${n} de octubre" aria-label="Día ${n}">${n}</button>`:`<span></span>`).join('')}</div><div class="attendance-footer"><span><b style="background:#c9ee84"></b> Completado</span><span><b style="background:#fae1dd"></b> Ausente</span><span><b style="background:#d8ded7"></b> Pendiente</span></div>`}
function coachDashboard(){return `<div class="coach-page screen"><section class="grid kpis">${stat('Alumnos activos','124','en tus programas','users','blue','+12%')}${stat('Planes asignados','36','individuales y grupales','book','warm','+8%')}${stat('Sesiones esta semana','286','entrenamientos registrados','flame','red','+16%')}${stat('Cambios pendientes','08','planes para revisar','calendar','','')}</section><section class="dash-grid"><article class="panel panel-inner">${phead('Actividad de entrenamiento','Volumen de sesiones de tus alumnos','Ver informe','view:activity')}<div class="legend"><span><i></i> Esta semana</span><span><i class="gray"></i> Semana anterior</span></div>${lineChart()}</article><article class="panel panel-inner">${phead('Progreso general','Adherencia de los programas','','')}<div class="progress-person"><div class="photo-person" aria-hidden="true"></div><div class="goal-metrics"><div class="goal-big">78%</div><div class="goal-small">cumplimiento<br>promedio</div><div class="meter"><span style="width:78%"></span></div><div class="goal-tags"><span>Objetivo</span><strong style="color:#313d2c">85%</strong></div></div></div><div class="bottom-caption" style="margin-top:12px"><span>Esta semana</span><b style="color:#6ca023">+6.4% ↑</b></div></article><article class="panel panel-inner">${phead('Asistencia','Vista mensual','','')}${calendarWidget()}</article></section><section class="dash-grid-second"><article class="panel panel-inner">${phead('Mi programa','Plan de Coach Villa','','')}<div class="subscription-icon">${ico('bolt',19)}</div><div class="plan-name">FIT60 Pro</div><div class="muted">Tu espacio de trabajo y comunidad.</div><div class="sub-info">Programas activos <strong>12</strong><br>Alumnos en seguimiento <strong>124</strong></div><button style="margin-top:15px" class="btn-lime stretch" data-a="view:programs">Gestionar programas ${ico('arrow')}</button></article><article class="panel panel-inner">${phead('Alumnos recientes','Últimos planes actualizados','Ver todos','view:students')}<div class="user-rows">${data.students.slice(0,3).map((p,i)=>`<div class="person-row"><span class="person-dot">${p.name.split(' ').map(q=>q[0]).join('').slice(0,2)}</span><span><strong>${p.name}</strong><small>Semana ${p.week} · ${p.program}</small></span><span class="tag ${i===1?'blue':''}">${p.progress}%</span></div>`).join('')}</div></article><article class="panel panel-inner">${phead('Videos y ejercicios','Biblioteca FIT60','Ver biblioteca','view:editor')}<div class="video-item"><div class="video-thumb">${ico('play')}</div><div><strong>Fuerza de tren inferior</strong><small>5 ejercicios · 45 min</small></div></div><div class="video-item"><div class="video-thumb alt">${ico('play')}</div><div><strong>Movilidad y técnica</strong><small>4 ejercicios · 25 min</small></div></div><div class="bottom-caption"><span>Contenido reutilizable</span><span>12 rutinas</span></div></article><article class="panel panel-inner">${phead('Accesos rápidos','Tu trabajo de hoy','','')}<div class="user-rows"><button class="btn-ghost stretch" data-a="view:editor">${ico('edit')} Personalizar un plan</button><button class="btn-ghost stretch" data-a="view:students">${ico('users')} Gestionar alumnos</button><button class="btn-ghost stretch" data-a="modal:assign">${ico('copy')} Asignar plantilla</button><button class="btn-dark stretch" data-a="view:programs">${ico('plus')} Crear programa</button></div></article></section><div class="ref-disclaimer">Interfaz de demostración · Las cifras mostradas son ejemplos, no registros reales.</div></div>`}
function programs(){let filtered=data.programs.filter(p=>st.programFilter==='Todos'||(st.programFilter==='Grupales'?p.students>8:p.students<=8));return `<div class="coach-page screen"><div class="actionbar"><div><div class="section-kicker">PLANES DE ENTRENAMIENTO Y ALIMENTACIÓN</div><h2 class="section-heading">Tus programas reutilizables</h2></div><button class="btn-lime" data-a="modal:newprogram">${ico('plus')} Nuevo programa</button></div><div class="filter-row"><div class="filter-chips">${['Todos','Grupales','Individuales'].map(x=>`<button class="${st.programFilter===x?'sel':''}" data-a="filter:${x}">${x}</button>`).join('')}</div><div class="subtitle">El diseño de cada alumno puede ajustarse sin modificar a los demás.</div></div><div class="card-list">${filtered.map(p=>`<article class="program-card"><div class="program-cover" style="background-image:linear-gradient(100deg,#111a14a3,#131a1219),url('${p.img}')"><div class="cover-content"><span>PLANTILLA MAESTRA</span><strong>${p.name}</strong></div></div><div class="program-info"><p>${p.detail}</p><div class="program-meta"><span>${ico('calendar',12)} ${p.weeks} semanas</span><span>${ico('users',12)} ${p.students} alumnos</span></div><div class="program-actions"><button class="btn-ghost" data-a="editprogram:${p.id}">${ico('edit')} Editar</button><button class="btn-lime" data-a="assignprogram:${p.id}">Asignar ${ico('arrow')}</button></div></div></article>`).join('')}</div><div class="feature-note"><strong>Plantilla maestra → asignación → copia personalizada.</strong> Los ajustes individuales se guardarán por alumno. Esta demostración permite recorrer el flujo sin conectar una base de datos.</div></div>`}

const weekday=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];function weekPicker(){return `<div class="edit-day-picker">${weekday.map((n,i)=>`<button data-a="day:${i}" class="${st.day===i?'current':''}">${n}<b>${19+i}</b></button>`).join('')}</div>`}

ta-a="modal:meal" style="margin:16px 0 20px">${ico('edit')} Modificar comida</button><div class="feature-note"><strong>Personalización segura</strong><br>Alumno seleccionado: ${stud.name}. Estos ajustes son solo suyos. No modifican la plantilla grupal.</div><button class="btn-dark stretch" data-a="modal:student" style="margin-top:11px">${ico('users')} Cambiar alumno</button></section></div></div>`}

function studentCalendar(){return `<div class="coach-page screen"><div class="dark-panel"><div class="dark-section-head"><h3>Semana ${st.week} · 12</h3><button data-a="view:workouts">Ver ejercicios ${ico('arrow',13)}</button></div><div class="weekly-days">${weekday.map((n,i)=>`<button class="${st.day===i?'picked':''}" data-a="day:${i}"><span>${n}</span><b>${19+i}</b></button>`).join('')}</div></div><div class="student-overview"><div class="dark-panel"><div class="dark-section-head"><h3>Entrenamiento</h3>${ico('dumbbell',20)}</div><div style="font-weight:800;font-size:21px;letter-spacing:-.7px;margin:16px 0 7px">${workoutFor(1)}</div><div class="micro-meta">${ico('clock')} 60 minutos · 5 ejercicios</div><button class="btn-lime" style="margin-top:22px" data-a="view:workouts">Ver rutina ${ico('arrow')}</button></div><div class="dark-panel"><div class="dark-section-head"><h3>Comidas</h3>${ico('food',20)}</div><div class="food-list">${data.food.map(f=>`<div class="food-item"><span class="food-photo ${f.key}"></span><span><strong>${f.key==='lunch'?mealFor(st.role==='student'?1:st.selectedStudent):f.name}</strong><small>${f.cal}</small></span></div>`).join('')}</div></div></div></div>`}
function studentActivity(){return `<div class="coach-page screen"><div class="student-step-grid">${[['68%','Plan completado'],['4 / 6','Sesiones semanales'],['142','Minutos activos']].map(([v,n])=>`<div class="dark-panel"><small>${n}</small><strong>${v}</strong><p>Semana actual</p></div>`).join('')}</div><div class="student-overview"><div class="dark-panel" style="display:grid;place-items:center;min-height:255px"><div><div class="progress-donut"><div><strong>${st.sessionDone?'75':'68'}%</strong><small>de tu semana</small></div></div><p style="font-size:10px;color:#9ba5a0;text-align:center;margin:18px 0 0">Vas construyendo constancia</p></div></div><div class="dark-panel"><div class="dark-section-head"><h3>Sesiones recientes</h3>${ico('chart')}</div>${[['Entrenamiento de piernas','Completado · lunes'],['Upper Body Strength','Completado · viernes'],['Movilidad y core','Completado · miércoles']].map(([n,t])=>`<div class="food-item"><span class="index-badge" style="background:#323b2b;color:var(--acid)">${ico('check',14)}</span><span><strong>${n}</strong><small>${t}</small></span></div>`).join('')}</div></div></div>`}
function studentScreen(){return ({dashboard:studentHome,workouts:studentWorkouts,nutrition:studentNutrition,calendar:studentCalendar,activity:studentActivity}[st.view]||studentHome)()}
function render(){let root=$('app');root.innerHTML=`<div class="app ${st.role==='student'?'is-student':''}">${sideNav()}<main class="main">${header()}${st.role==='coach'?coachScreen():studentScreen()}</main>${mobileNav()}</div>${modal?modalHtml():''}<div id="toast-slot"></div>`;document.title=`FIT60 · ${st.role==='coach'?'Coach Villa':'Mi programa'}`}
function modalHtml(){let cfg={assign:['Asignar programa','Selecciona un plan y define si lo asignarás a un grupo o a un alumno.'],newprogram:['Nuevo programa','Crea una nueva plantilla maestra para reutilizarla con varios alumnos.'],workout:['Editar entrenamiento','Este cambio aplica únicamente al programa personalizado seleccionado.'],meal:['Editar comida o receta','Puedes modificar una comida sin cambiar los demás planes.'],student:['Cambiar alumno','Selecciona a qué alumno pertenece el ajuste individual.'],session:['Comenzar entrenamiento','Demostración de una sesión con registro de entrenamiento.'],settings:['Ajustes de FIT60','Configuración del proyecto y preferencias del entrenador.'],notifications:['Notificaciones','Resumen de notificaciones de ejemplo.'],shopping:['Lista de compras','Ingredientes recomendados para tus comidas del día.'],recipe:['Detalle de la receta','Preparación, ingredientes y cantidades de la comida seleccionada.']}[modal]||['FIT60','Vista de demostración'];let body='';if(modal==='assign')body=`<div class="field"><label>Programa</label><select id="field-program">${data.programs.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div><div class="field"><label>Asignar a</label><select id="field-type"><option value="grupo">Grupo FIT60 Transformación</option><option value="individual">Alumno individual</option></select></div><p class="hint">La asignación crea un plan por alumno para permitir modificaciones personales.</p>`;else if(modal==='newprogram')body=`<div class="field"><label>Nombre del programa</label><input id="field-name" value="Nuevo programa FIT60"></div><div class="field"><label>Duración</label><select id="field-length"><option>8 semanas</option><option>12 semanas</option><option>16 semanas</option></select></div>`;else if(modal==='workout')body=`<div class="field"><label>Nombre del entrenamiento</label><input id="field-name" value="${esc(st.role==='student'?workoutFor(1):workoutFor())}" /></div><div class="field"><label>Alumno</label><select id="field-student">${data.students.map(p=>`<option value="${p.id}" ${p.id===st.selectedStudent?'selected':''}>${p.name}</option>`).join('')}</select></div><p class="hint">El cambio se verá en el editor del entrenador y en la vista del alumno de demostración.</p>`;else if(modal==='meal')body=`<div class="field"><label>Nombre de la comida</label><input id="field-name" value="${esc(st.role==='student'?mealFor(1):mealFor())}" /></div><div class="field"><label>Tipo</label><select><option>Almuerzo</option><option>Desayuno</option><option>Cena</option></select></div><p class="hint">La receta se actualizará en el plan de ejemplo. Las plantillas grupales permanecen separadas.</p>`;else if(modal==='student')body=`<div class="field"><label>Alumno</label><select id="field-student">${data.students.map(p=>`<option value="${p.id}" ${p.id===st.selectedStudent?'selected':''}>${p.name}</option>`).join('')}</select></div>`;else if(modal==='session')body=`<div class="hint">Rutina: ${esc(st.role==='student'?workoutFor(1):workoutFor())}<br>Objetivo: 5 ejercicios · 60 minutos<br>En el producto final podrán registrarse peso, series, repeticiones y esfuerzo.</div>`;else if(modal==='shopping')body=`<div class="hint">Avena · frutas · yogur · pollo · arroz · vegetales · salmón · aguacate</div>`;else if(modal==='recipe')body=`<div class="hint">${esc(st.role==='student'?mealFor(1):mealFor())}<br>Ingredientes y cantidades se vincularán al plan individual del alumno.<br>Esta pantalla es un ejemplo visual.</div>`;else body=`<div class="hint">Esta función se conectará a los datos del proyecto en una siguiente etapa.</div>`;return `<div class="modal-layer" role="presentation" data-a="modalclose"><div class="modal" role="dialog" aria-modal="true" aria-label="${cfg[0]}" onclick="event.stopPropagation()"><div class="modal-head"><h2>${cfg[0]}</h2><button class="modal-close" aria-label="Cerrar" data-a="modalclose">${ico('close')}</button></div><p>${cfg[1]}</p>${body}<div class="modal-footer"><button class="btn-ghost" data-a="modalclose">Cancelar</button><button class="btn-lime" data-a="modalsave">${ico('check')} ${modal==='session'?'Finalizar sesión':'Guardar cambios'}</button></div></div></div>`}
function notify(msg){const slot=$('toast-slot');if(!slot)return;slot.innerHTML=`<div class="toast" role="status">${ico('checkcircle')} ${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{if(slot)slot.innerHTML=''},3200)}
function modalSave(){let type=modal;let msg='Acción de demostración.';
if(type==='workout'){let name=$('field-name')?.value.trim();st.selectedStudent=Number($('field-student')?.value)||st.selectedStudent;if(name){st.overrides[st.selectedStudent]={...(st.overrides[st.selectedStudent]||{}),workoutName:name}}msg='Entrenamiento actualizado solo para el alumno.';}
else if(type==='meal'){let name=$('field-name')?.value.trim();if(name)st.overrides[st.selectedStudent]={...(st.overrides[st.selectedStudent]||{}),mealName:name};msg='Comida personalizada actualizada.';}
else if(type==='student'){st.selectedStudent=Number($('field-student')?.value)||st.selectedStudent;msg='Alumno seleccionado.';}
else if(type==='assign'){msg='Asignación simulada. Se necesitará base de datos para publicarla.';}
else if(type==='newprogram'){msg='El nuevo programa requerirá una base de datos para guardarlo.';}
else if(type==='session'){st.sessionDone=true;msg='Sesión completada en este prototipo.';}
modal='';render();notify(msg);}

function handle(action){if(!action)return;let [a,...args]=action.split(':');const v=args.join(':');if(a==='role')return roleSet(v);if(a==='dashboard')st.view='dashboard';else if(a==='view')st.view=v;else if(a==='modal')modal=v;else if(a==='modalclose')modal='';else if(a==='modalsave')return modalSave();else if(a==='day'){st.day=+v}else if(a==='week'){st.week=Math.min(12,Math.max(1,st.week+Number(v)))}else if(a==='filter')st.programFilter=v;else if(a==='editprogram'){st.selectedProgram=v;st.view='editor'}else if(a==='assignprogram'){st.selectedProgram=v;modal='assign'}else if(a==='studentedit'){st.selectedStudent=+v;st.view='editor'}else if(a==='stab')st.studentTab=v;else if(a==='recipe')modal='recipe';else if(a==='toast'){notify(v);return;}render()}
document.addEventListener('click',e=>{const target=e.target.closest('[data-a]');if(target){e.preventDefault();handle(target.dataset.a)}});document.addEventListener('input',e=>{if(e.target?.id==='studentSearch'){const term=e.target.value.toLowerCase().trim();document.querySelectorAll('.student-row').forEach(row=>row.style.display=row.dataset.name.includes(term)?'':'none')}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal='';render()}});
render();
})();
</script>
</body>
</html>
